name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked-out package version to npm (retry a failed release)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Release Please branch, tags and releases
      id-token: write # npm trusted publishing
      pull-requests: write # coverage report comment
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: "true"
          run-install: "true"

      - name: 🎭 Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: ⚙️ Setup Playwright OS dependencies
        run: vpx playwright install-deps chromium
        working-directory: packages/ui

      - name: ⚙️ Setup Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vpx playwright install chromium
        working-directory: packages/ui

      - parallel:
          - name: 🧹 Checks
            run: vp check

          - name: 📦 Pack UI package
            run: vpr pack

      - name: 🏗️ Build docs app
        run: vpr docs

      - name: 🧪 Test UI package with coverage
        run: vp test --coverage --run
        working-directory: packages/ui

      - name: 📊 Report coverage to PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && hashFiles('packages/ui/coverage/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: packages/ui
          vite-config-path: ./vite.config.ts

      - name: 📄 Upload docs build
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          if-no-files-found: error

      - name: 🚀 Run Release Please
        id: release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Bun does not support npm trusted publishing yet; use Node only to publish.
      - name: ⚙️ Setup Node for npm publish
        if: ${{ steps.release.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: 📦 Publish to npm
        if: ${{ steps.release.outputs.releases_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: rm -f ./*.tgz && vp pm pack && npm_config_force=true npm publish ./*.tgz --access public --tag latest
        working-directory: packages/ui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: ⚙️ Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: "true"
          run-install: "true"

      - name: 📄 Download docs build
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: apps/docs/dist

      - name: 🚀 Deploy docs to Cloudflare
        run: vpr cf:deploy
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
