name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Steps are inline, not the shared rixlhq/github-actions frontend-ci workflow:
# this repo is public and that one is private, and GitHub doesn't let a public
# repo call a private repo's reusable workflow (every run failed in 0s at
# startup). docs, the other public repo, does the same.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Release Please branch, tags and releases
      id-token: write # npm trusted publishing
      pull-requests: write # coverage report comment
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: ⚙️ Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: "true"
          run-install: "true"

      - name: 🎭 Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      - name: ⚙️ Setup Playwright OS dependencies
        run: vpx playwright install-deps chromium
        working-directory: packages/ui

      - name: ⚙️ Setup Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: vpx playwright install chromium
        working-directory: packages/ui

      # Check and package gates are independent; docs builds after the UI pack.
      - parallel:
          - name: 🧹 Workspace checks
            run: vpr ci:check

          - name: 🧪 UI package gate
            run: vpr ci:ui

      - name: 🏗️ Build docs app
        run: vpr ci:docs

      - name: 📊 Report coverage to PR
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && hashFiles('packages/ui/coverage/coverage-summary.json') != '' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: packages/ui
          vite-config-path: ./vite.config.ts

      - name: 🚀 Run Release Please
        id: release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Bun does not support npm trusted publishing yet; use Node only to publish.
      - name: ⚙️ Setup Node for npm publish
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: 📦 Publish to npm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: rm -f ./*.tgz && vp pm pack && npm_config_force=true npm publish ./*.tgz --access public --tag latest
        working-directory: packages/ui
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
