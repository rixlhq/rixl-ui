name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # coverage report comment

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: rixlhq/github-actions/.github/workflows/frontend-ci.yml@main
    with:
      # The publishable library lives in packages/ui; install and commands run
      # there (the workspace lockfile stays at the repo root).
      working-directory: packages/ui
      # Chromium for the browser test project (axe checks run there).
      prepare: vp exec playwright install --with-deps chromium
      # The `ci` script in packages/ui/package.json defines what CI runs:
      # check, fmt, suppressions, Knip, unit and browser tests with coverage
      # floors, the package build, the size budget and publint.
      commands: vp run ci
      coverage-report: true
      coverage-vite-config: ./vite.config.ts
      timeout-minutes: 10
