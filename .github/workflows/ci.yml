name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write # coverage report comment

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: rixlhq/github-actions/.github/workflows/frontend-ci.yml@main
    with:
      # The publishable library lives in packages/ui; install and commands run
      # there (the workspace lockfile stays at the repo root).
      working-directory: packages/ui
      # The `ci` script in packages/ui/package.json defines what CI runs:
      # check, fmt --check, tests with coverage, and the package build.
      commands: vp run ci
      coverage-report: true
      coverage-vite-config: ./vite.config.ts
      timeout-minutes: 10

  browser-tests:
    name: Browser Tests (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run Vitest browser tests
        run: bun run test:browser
