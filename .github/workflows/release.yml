name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]

# PR checks moved to ci.yml, which reports the shared `ci / ci` check. This
# workflow only runs on main pushes: release-please opens/updates the release
# PR, and merging that PR publishes to npm. Publish runs the full gate
# (the root `vpr ci`, which checks the workspace and builds both packages)
# first, so nothing ships unchecked.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Caps the job so a hung install, build or npm publish can't run to
    # GitHub's 6h default. Observed max over the last 37 runs was 2.0 min,
    # before the gate and the Chromium install were added to release runs.
    # Note this bounds runner time only, not time spent queued or awaiting
    # approval.
    timeout-minutes: 15
    permissions:
      id-token: write # Required for NPMJS OIDC
      contents: write
      pull-requests: write
      packages: write
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact release: the moving `v1` tag is frozen at v1.15.0.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: "true"
          run-install: "true"

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # GITHUB_TOKEN's events never start workflow runs, so a release PR
          # opened with it will sit at "Expected: waiting for status" — a human
          # must push an empty commit or close/reopen to kick CI off.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Bun currently does not support publishing with NPM OIDC (Trusted Publishing),
      # so we swap in Node just for `npm publish`.
      - name: Setup Node for npm publish
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          # npm validates devEngines on publish; keep the node version pinned
          # in .node-version so a floating major can't drift into a mismatch.
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      # The root release gate is the same workspace gate CI runs on a pull
      # request, rerun on the exact commit being published.
      - name: Install Chromium for the browser tests
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: vpx playwright install --with-deps chromium

      - name: Run the gate (includes vp pack)
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: vpr -F rixl-ui-workspace ci

      - name: Publish to npm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
