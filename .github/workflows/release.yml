name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for NPMJS OIDC
      contents: write
      pull-requests: write
      packages: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: "true"
          run-install: "true"

      - name: Lint and type-check
        run: vp check

      - name: Format check
        run: vp fmt --check

      - name: Build library
        run: vp pack

      - name: Run tests with coverage
        run: vp test --coverage --run

      - name: Report coverage to PR
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          working-directory: packages/ui
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
          vite-config-path: ./vite.config.ts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Release Please
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.BUILD_GITHUB_TOKEN }}
          config-file: packages/ui/release-please-config.json
          manifest-file: packages/ui/.release-please-manifest.json

      - name: Setup Node for npm publish
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 25
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: vp pack && npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
