name: Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]

# PR checks moved to ci.yml, which reports the shared `ci / ci` check. This
# workflow only runs on main pushes: release-please opens/updates the release
# PR, and merging that PR publishes to npm. Publish runs `vp pack` first, so
# nothing ships unbuilt.

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Caps the job so a hung install, build or npm publish can't run to
    # GitHub's 6h default. Observed max over the last 37 runs: 2.0 min.
    # Note this bounds runner time only, not time spent queued or awaiting
    # approval.
    timeout-minutes: 10
    permissions:
      id-token: write # Required for NPMJS OIDC
      contents: write
      pull-requests: write
      packages: write
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact release: the moving `v1` tag is frozen at v1.15.0.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          working-directory: packages/ui
          cache: "true"
          run-install: "true"

      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          # BUILD_GITHUB_TOKEN so the release PR triggers CI — the default
          # GITHUB_TOKEN's events never start workflow runs, so a release PR
          # opened with it would sit at "Expected: waiting for status".
          token: ${{ secrets.BUILD_GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Bun currently does not support publishing with NPM OIDC (Trusted Publishing),
      # so we swap in Node just for `npm publish`.
      - name: Setup Node for npm publish
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 25
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: vp pack && npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
