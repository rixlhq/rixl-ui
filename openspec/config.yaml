schema: spec-driven

# Shown to the agent whenever it writes an artifact. Conventions live in
# AGENTS.md and .agents/rules/; this only says where.
context: |
  @rixl/ui: the Rixl design system, published to npm (MIT) and rendered by dashboard, landing and docs.
  React components on Base UI (@base-ui/react), Tailwind 4 with the --rixl-* tokens in
  packages/ui/src/styles/preset.css, TypeScript 7, Vite+ (`vp`), one build entry per component.
  Read AGENTS.md and the rule files it lists before writing any artifact.
  What a Base UI primitive does is Base UI's; check its source or docs before claiming it.

rules:
  proposal:
    - "Include a **Non-goals** section: what this change will not do."
    - "Include **Acceptance**: the observable outcomes that mean the change is done."
    - "Say whether the change is breaking for consumers (a renamed or removed export, a changed default) and why."
    - "Use `skip_specs: true` for a change with no behaviour change (refactor, dependency bump, tooling)."
  specs:
    - "Every requirement has at least one scenario a test or the build can check."
    - "Describe behaviour a consumer or an end user can observe, not implementation."
  design:
    - "Write design.md for any choice a reviewer could reasonably question, not only for the cases the schema lists."
    - "Record each such choice as a decision entry: **Chosen**, **Alternatives considered** (and why each lost), **Dropped** (anything tried or started and abandoned, why, and what replaced it), and **Evidence** (the doc, measurement or test it rests on)."
    - "Never delete a dropped entry. It stops the next agent proposing the same approach again."
  tasks:
    - "Each implementation task names the test that proves it (file and test name) or, for work a test can't cover, the command or check that does."
    - "Tick a task only with its evidence written on the task: the passing test, or the command and its result."
    - "A task you can't finish stays unticked with a reason. Never tick it to close the change."
