pre-commit:
  parallel: true
  commands:
    check:
      root: "packages/ui/"
      glob: "*.{ts,tsx}"
      run: vp check --fix {staged_files}
      stage_fixed: true
    format:
      root: "packages/ui/"
      glob: "*.{json,md,yaml,yml,css}"
      run: vp fmt --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    gate:
      run: vp run -F @rixl/ui test:run && vp run -F @rixl/ui build
