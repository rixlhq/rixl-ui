pre-commit:
  commands:
    check:
      run: vp check --fix {staged_files} < /dev/null
      stage_fixed: true

pre-push:
  commands:
    pack:
      glob: "*.{js,ts,jsx,tsx}"
      run: vpr pack < /dev/null
      timeout: 2m
    test:
      glob: "*.{js,ts,jsx,tsx}"
      run: vp test related {push_files} --run --bail=1 < /dev/null
      timeout: 2m
