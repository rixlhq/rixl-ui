pre-commit:
  commands:
    staged:
      # `vp staged` reads packages/ui/vite.config.ts#staged and runs
      # `vp check --fix` on staged *.ts,tsx and `vp fmt --write` on
      # staged *.{json,md,yaml,yml,css}. It scopes the git diff to the
      # cwd, so files outside packages/ui/ are simply not touched.
      root: "packages/ui/"
      run: vp staged

pre-push:
  commands:
    check:
      run: bun run --filter=@rixl/ui check
    fmt-check:
      run: bun run --filter=@rixl/ui fmt --check
    test:
      run: bun run --filter=@rixl/ui test:run
    build:
      run: bun run --filter=@rixl/ui build
