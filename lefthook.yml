# Run the lefthook pinned in the root package.json, not a global install, so
# every machine runs the same hook version.
lefthook: node_modules/.bin/lefthook
min_version: 2.2.2

# The library lives in packages/ui: `root` runs each command there, with staged
# paths relative to it, and leaves files outside the package alone.
#
# Every job reads stdin from /dev/null so a hidden prompt can't block it, and the
# slow ones have a timeout (well above their full run on a laptop) so a hang fails
# the hook instead of stalling it.

pre-commit:
  # In order, stopping at the first failure: the fixes land before the tests read the files.
  piped: true
  commands:
    check:
      root: "packages/ui/"
      glob:
        - "*.{js,mjs,ts,tsx}"
        - "*.{json,md,yaml,yml,css}"
      run: vp check --fix {staged_files} < /dev/null
      stage_fixed: true
    suppressions:
      root: "packages/ui/"
      glob: "*.{ts,tsx}"
      run: vp run lint:suppressions < /dev/null
    test:
      root: "packages/ui/"
      glob: "*.{ts,tsx}"
      # Unit tests that import the staged files; the browser project runs on push and in CI.
      run: vp test related {staged_files} --project unit --run --bail=1 < /dev/null
      timeout: 2m

pre-push:
  parallel: true
  commands:
    test:
      root: "packages/ui/"
      run: vp test --run < /dev/null
      timeout: 3m
    build:
      root: "packages/ui/"
      run: vp pack < /dev/null
      timeout: 3m
    knip:
      root: "packages/ui/"
      run: vp run knip < /dev/null
      timeout: 2m
    react-doctor:
      root: "packages/ui/"
      glob: "*.{jsx,tsx}"
      run: vp run react-doctor < /dev/null
      timeout: 2m
